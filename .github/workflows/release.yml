name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.11"
          cache: true

      - name: Run tests before release
        run: go test -v -coverprofile=coverage.txt -coverpkg=github.com/MimoJanra/confkit ./...

      - name: Check test coverage
        run: |
          coverage=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${coverage}%"
          if (( $(echo "$coverage < 75" | bc -l) )); then
            echo "ERROR: Coverage is below 75%"
            exit 1
          fi

      - name: Run security checks
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

          echo "=== Running gosec ===" >> security-evidence.txt
          gosec -fmt json -out gosec-results.json ./... || true

          echo "=== Running govulncheck ===" >> security-evidence.txt
          govulncheck ./... >> security-evidence.txt 2>&1 || true

          echo "=== Test coverage ===" >> security-evidence.txt
          go tool cover -func=coverage.txt >> security-evidence.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Extract changelog for this version
          NOTES=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | head -n -1)

          if gh release view "$VERSION" &>/dev/null; then
            gh release edit "$VERSION" \
              --title "Release ${VERSION}" \
              --notes "$NOTES"
            gh release upload "$VERSION" \
              coverage.txt security-evidence.txt gosec-results.json \
              --clobber
          else
            gh release create "$VERSION" \
              --title "Release ${VERSION}" \
              --notes "$NOTES" \
              coverage.txt security-evidence.txt gosec-results.json
          fi
