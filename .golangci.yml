version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - unconvert
    - misspell
    - revive
    - gosec
    - bodyclose

  settings:
    misspell:
      ignore-rules:
        # "strat" is an abbreviation of "strategy", not a typo for "start".
        - strat

  exclusions:
    rules:
      # Tests deliberately use fixed permissions and hardcoded fixtures.
      - path: _test\.go
        linters:
          - gosec
      # Reading a caller-supplied config path is this library's entire purpose.
      - path: (file_sources|watcher|discovery)\.go
        linters:
          - gosec
        text: "G304"
      # Test files and examples are not part of the published API surface.
      - path: (_test\.go|examples/)
        linters:
          - revive
        text: "^(exported|package-comments):"
      # Names such as vault.VaultTokenAuth and aws.AWSSSMSource do stutter, but they
      # are frozen exported API (see STABLE.md): renaming them needs a deprecation
      # notice and a major release, so it is a v2.0 candidate rather than a lint fix.
      - linters:
          - revive
        text: "stutters; consider calling this"
      # Callback and Source signatures are fixed by their interfaces, so unused
      # parameters there are structural rather than accidental.
      - linters:
          - revive
        text: "^unused-parameter:"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
